<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>PostService — Редагування</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PostService</h1>
        <nav>
            <a href="index.html">Головна</a>
            <a href="postings.html">Відправлення</a>
            <a href="about.html">Про програму</a>
        </nav>
    </header>
    <main>
        <h2 id="formTitle">Нове відправлення</h2>
        <p id="formStatus" class="error-msg"></p>
        <form id="editForm" novalidate>
            <div class="form-group">
                <label for="from">Відправник</label>
                <input type="text" id="from">
                <div class="error-msg" id="from-error">Вкажіть відправника</div>
            </div>
            <div class="form-group">
                <label for="to">Одержувач</label>
                <input type="text" id="to">
                <div class="error-msg" id="to-error">Вкажіть одержувача</div>
            </div>
            <div class="form-group">
                <label for="content">Вміст</label>
                <input type="text" id="content">
                <div class="error-msg" id="content-error">Вкажіть вміст</div>
            </div>
            <div class="form-group">
                <label for="deliveryType">Тип доставки</label>
                <select id="deliveryType">
                    <option value="0">Відділення</option>
                    <option value="1">Кур'єр</option>
                    <option value="2">Експрес-кур'єр</option>
                </select>
            </div>
            <div class="form-group">
                <label for="weight">Вага (кг)</label>
                <input type="number" id="weight" min="0.1" step="0.1">
                <div class="error-msg" id="weight-error">Вага має бути більше 0</div>
            </div>
            <div class="form-group">
                <label for="width">Ширина (см)</label>
                <input type="number" id="width" min="1" step="0.1">
                <div class="error-msg" id="width-error">Вкажіть ширину</div>
            </div>
            <div class="form-group">
                <label for="height">Висота (см)</label>
                <input type="number" id="height" min="1" step="0.1">
                <div class="error-msg" id="height-error">Вкажіть висоту</div>
            </div>
            <div class="form-group">
                <label for="depth">Довжина (см)</label>
                <input type="number" id="depth" min="1" step="0.1">
                <div class="error-msg" id="depth-error">Вкажіть довжину</div>
            </div>
            <div class="form-group">
                <label for="value">Оголошена вартість (грн)</label>
                <input type="number" id="value" min="0" step="0.01">
            </div>
            <div class="btn-row">
                <button type="button" id="btnSave" class="btn">Зберегти</button>
                <button type="button" id="btnCancel" class="btn btn-secondary">Скасувати</button>
            </div>
        </form>
    </main>
    <script src="app.js"></script>
    <script src="edit.js"></script>
</body>
</html>
