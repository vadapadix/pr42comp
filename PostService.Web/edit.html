lder="0" aria-describedby="width-error" required min="0" step="1"><div class="error-msg" id="width-error"></div></div><div class="form-group "><label for="height">Висота (см) *</label><input type="number" id="height" name="height" placeholder="0" aria-describedby="height-error" required min="0" step="1"><div class="error-msg" id="height-error"></div></div></div></fieldset><div class="form-group "><label for="content">Опис / вміст *</label><input type="text" id="content" name="content" placeholder="Наприклад: документи, одяг, сувенірна продукція"  aria-describedby="content-error" required><div class="error-msg" id="content-error"></div></div><div class="btn-row"><button type="button" id="btnCancel" class="btn btn-outline">Скасувати</button><button type="submit" id="btnSave" class="btn btn-primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L20 5"/></svg>Зберегти відправлення</button></div></form></section></main><footer class="site-footer"><span>© 2026 PostService. Всі права захищено.</span><span>Версія 2.4.1</span></footer><nav class="mobile-nav" aria-label="Мобільна навігація"><a href="index.html" ><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg><span>Головна</span></a><a href="postings.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Список відправлень</span></a><a href="about.html" ><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle
